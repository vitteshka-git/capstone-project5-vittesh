version: 0.2

phases:
  install:
    commands:
      - export HOME=/tmp
      - export GOCACHE=/tmp/go-build-cache
      - export GOPATH=/tmp/go
      - mkdir -p "$GOCACHE" "$GOPATH"
      - go version

  pre_build:
    commands:
      - echo "Downloading Go dependencies..."
      - go mod download
      - echo "Running unit tests..."
      - go test -v ./...
      - echo "Running race detector..."
      - go test -race -v ./...

  build:
    commands:
      - echo "Building Order Management API..."
      - mkdir -p build
      - go build -o build/order-management .
      - echo "Building Product Service..."
      - go build -o build/product-service ./cmd/product-service

  post_build:
    commands:
      - echo "All tests and builds completed successfully."

artifacts:
  files:
    - build/**/*
  discard-paths: no