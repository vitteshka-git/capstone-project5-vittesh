version: 0.2

phases:
  install:
    commands:
      - export HOME=/tmp
      - export GOCACHE=/tmp/go-build-cache
      - export GOPATH=/tmp/go
      - mkdir -p "$GOCACHE" "$GOPATH"
      - go version

  pre_build:
    commands:
      - go mod download
      - go test ./...

  build:
    commands:
      - mkdir -p build
      - go build -o build/order-management .
      - go build -o build/product-service ./cmd/product-service

artifacts:
  files:
    - build/**/*
  discard-paths: no