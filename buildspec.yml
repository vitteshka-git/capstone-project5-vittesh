version: 0.2

phases:
  install:
    commands:
      - go version

  pre_build:
    commands:
      - go mod download
      - go test ./...

  build:
    commands:
      - mkdir -p build
      - go build -o build/order-management .
      - go build -o build/product-service ./cmd/product-service

artifacts:
  files:
    - build/**/*
  discard-paths: no